databases:
  - name: mentorship-db
    databaseName: mentorship
    user: mentorship
    plan: free

services:
  - type: web
    name: mentorship-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mentorship-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://mentorship-frontend.onrender.com

  - type: web
    name: mentorship-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://mentorship-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
